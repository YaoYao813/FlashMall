# =========================================================
# 服务器配置
# =========================================================
server.port=8080

# =========================================================
# 应用名称
# =========================================================
spring.application.name=seckill-service

# =========================================================
# 数据源配置（MySQL）
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/flashmall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# Redis 配置（无密码）
# =========================================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=3000ms
spring.redis.lettuce.pool.max-active=16
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=4
spring.redis.lettuce.pool.max-wait=500ms

# =========================================================
# MyBatis-Plus 配置
# =========================================================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# =========================================================
# 日志配置
# =========================================================
logging.level.com.flashmall=debug
logging.level.com.example=debug
logging.level.org.springframework=info
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =========================================================
# 如果您的本地 Redis 有密码，取消下面注释并填写密码
# =========================================================
# spring.redis.password=your_redis_password

# =========================================================
# 可选：如果使用 HikariCP 连接池（Spring Boot 默认），可调整参数
# =========================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
