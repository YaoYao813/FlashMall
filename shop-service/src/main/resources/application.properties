# Redis 配置：支持单机与集群模式
# redisson.mode = single | cluster
redisson.mode=single
# 单机地址示例
redisson.address=redis://127.0.0.1:6379
# 集群地址示例（逗号分隔）
# redisson.address=redis://127.0.0.1:7000,redis://127.0.0.1:7001
redisson.password=

# Spring Redis (lettuce/jedis) 连接（如使用 Spring Boot 的自动配置）
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=${DB_PASSWORD:}

# RabbitMQ 基础配置
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=567
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# 交换机/队列/路由键（与代码中常量对应）
seckill.rabbit.exchange=seckill.exchange
seckill.rabbit.queue=seckill.order.queue
seckill.rabbit.routing-key=seckill.order

# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/flashmall?useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.flashmall.common.entity
mybatis-plus.global-config.db-config.id-type=auto

bloom:filter:enabled=true;


