# 服务名称（Nacos 注册）
spring.application.name=shop-service

server.port=8082

# Nacos 服务发现
spring.cloud.nacos.discovery.server-addr=${NACOS_ADDR:nacos:8848}
# Redis 配置：支持单机与集群模式
# redisson.mode = single | cluster
redisson.mode=single
# 单机地址示例
redisson.address=redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
# 集群地址示例（逗号分隔）
# redisson.address=redis://127.0.0.1:7000,redis://127.0.0.1:7001
redisson.password=

# Spring Redis (lettuce/jedis) 连接（如使用 Spring Boot 的自动配置）
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}

# RabbitMQ 基础配置
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:123456}

# 交换机/队列/路由键（与代码中常量对应）
seckill.rabbit.exchange=seckill.exchange
seckill.rabbit.queue=seckill.order.queue
seckill.rabbit.routing-key=seckill.order

# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/flashmall?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.flashmall.common.entity
mybatis-plus.global-config.db-config.id-type=auto

bloom:filter:enabled=true;

jwt.secret=${JWT_SECRET:flashmall-secret-key-2024}
jwt.expiration=604800

# SpringDoc (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=店铺/商品服务
springdoc.info.description=商品列表、商品详情、店铺详情
