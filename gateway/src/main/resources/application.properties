# 强制使用 Reactive(WebFlux) 模式，防止 Servlet 栈冲突导致 503
spring.main.web-application-type=reactive

# 服务端口
server.port=8888

  # 应用名称
spring.application.name=gateway

  # Nacos 注册中心
spring.cloud.nacos.discovery.server-addr=${NACOS_ADDR:nacos:8848}

  # 网关服务发现（自动发现Nacos服务）
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

  # ====================== 网关路由配置 ======================
  # 路由1：用户服务
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/address/**

  # 路由2：店铺/商品服务
spring.cloud.gateway.routes[1].id=shop-service
spring.cloud.gateway.routes[1].uri=lb://shop-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/shop/**,/api/product/**

  # 路由3：订单服务
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**,/api/pay/**

  # 路由4：秒杀服务
spring.cloud.gateway.routes[3].id=seckill-service
spring.cloud.gateway.routes[3].uri=lb://seckill-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/seckill/**

  # 路由5：Agent 管理接口（建活动、列表、修改、库存同步、统计）
spring.cloud.gateway.routes[4].id=seckill-admin
spring.cloud.gateway.routes[4].uri=lb://seckill-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/**

  # ====================== 全局跨域配置 ======================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

  # ====================== Redis 配置 ======================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

  # ====================== JWT 配置 ======================
jwt.secret=${JWT_SECRET:flashmall-secret-key-2024}
jwt.expiration=604800

  # ====================== Sentinel 控制台 ======================
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:sentinel:8858}
spring.cloud.sentinel.transport.port=8719
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.client-ip=${SENTINEL_CLIENT_IP:gateway}

# ====================== 日志配置 ======================
logging.level.com.example.flashmall.gateway=debug