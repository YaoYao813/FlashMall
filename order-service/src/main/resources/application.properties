# 应用服务 WEB 访问端口
server.port=8080

# 配置MySQL连接信息
spring.datasource.url=jdbc:mysql://localhost:3306/flashmall?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 配置MyBatis-Plus
mybatis-plus.configuration.log-impl:org.apache.ibatis.logging.stdout.StdOutImpl  # 开发阶段开启SQL日志
mybatis-plus.global-config.db-config.id-type:auto
mybatis-plus.mapper-locations:classpath*:/mapper/*.xml  # 如果有XML

# 日志
logging.level.com.example.flashmall.order: debug