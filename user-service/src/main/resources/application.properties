# 服务名称（Nacos 注册）
spring.application.name=user-service

# 服务器端口配置
server.port=8081

# Nacos 服务发现
spring.cloud.nacos.discovery.server-addr=192.168.189.128:8848

# 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/flashmall?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yaozw813
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis配置（支持环境变量覆盖）
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# MyBatis-Plus配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# JWT配置（支持环境变量覆盖）
jwt.secret=${JWT_SECRET:flashmall-secret-key-2024}
jwt.expiration=604800

# SpringDoc (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=用户服务
springdoc.info.description=注册、登录、登出

# 日志级别配置
logging.level.com.example.flashmall.user=debug