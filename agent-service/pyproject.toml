[project]
name = "flashmall-agent"
version = "0.1.0"
description = "FlashMall 运营决策 Agent — 高并发秒杀商城的 AI 运营侧助手（LangGraph + MCP）"
requires-python = ">=3.10"
# 版本在首次安装后按实际锁定，不预先猜
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langgraph-checkpoint-redis",
    "mcp",
    "redis",
    "python-dotenv",
    # Windows 自带 Python 没有 IANA 时区库，ZoneInfo("Asia/Shanghai") 需要它
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
